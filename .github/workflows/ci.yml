name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Tailwind is pinned to v3 because v4's oxide binary requires Node >= 20;
          # keep CI on the same major the project targets.
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just this ref — gitleaks' `git` mode scans commit diffs, so a
          # secret committed and later removed from the working tree is still caught.
          fetch-depth: 0

      - name: Gitleaks
        # The gitleaks CLI itself is free and open source; only the gitleaks-action wrapper
        # requires a paid GITLEAKS_LICENSE for organization-owned repos. Running the image
        # directly avoids that entirely.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git --redact --no-banner -v /repo

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, secrets]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
