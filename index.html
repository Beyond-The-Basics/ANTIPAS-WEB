<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <!-- Discover's type system (design handoff 7b): Sora display, Instrument Sans body, Rubik for
         Arabic. display=swap + matching fallback stacks in tailwind.config.js avoid a layout jump. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap"
    />
    <title>Kickoff API Console</title>
    <script>
      // Applied before React mounts so a dark-preferring visitor never sees a light flash.
      // Mirrors the key/logic in src/context/Theme.tsx — keep the two in sync.
      (function () {
        var stored = localStorage.getItem("kickoff:theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
